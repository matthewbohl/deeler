name: Build and publish deeler

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remove-original-run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove original pre-sanitization run and its logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/44156651896"
          for attempt in {1..12}; do
            code=$(curl -sS -o /tmp/original-run.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" "$api")
            if [[ "$code" == 404 ]]; then exit 0; fi
            if [[ "$code" != 200 ]]; then echo "Run lookup failed: $code"; exit 1; fi
            if [[ "$(jq -r .status /tmp/original-run.json)" == completed ]]; then
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api"
              exit 0
            fi
            curl -sS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/cancel"
            sleep 5
          done
          echo 'Original workflow has not stopped yet.' >&2
          exit 1

  smoke-test:
    needs: remove-original-run
    if: always() && (needs.remove-original-run.result == 'success' || needs.remove-original-run.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./deeler
          load: true
          tags: deeler:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke
      - name: Test agent binaries, SSH, persistence, and restart
        run: bash scripts/smoke-test.sh deeler:smoke

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deeler"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "$image:latest"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$image:${GITHUB_REF_NAME#v}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./deeler
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=deeler
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=smoke
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
