name: Stop obsolete build
on:
  push:
    branches: [main]
    paths: [.github/workflows/stop-obsolete-build.yaml]
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop a superseded run that ignored ordinary cancellation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/cancel-result.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/44157746267/force-cancel")
          case "$code" in
            202|409) echo 'Cancellation requested or run already completed.' ;;
            *) echo "Cancellation failed: $code"; exit 1 ;;
          esac
